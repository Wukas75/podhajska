name = "podhajska"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 databáza – vytvor cez `npx wrangler d1 create podhajska` a doplň database_id
[[d1_databases]]
binding = "DB"
database_name = "podhajska"
database_id = "889cbce5-100d-40ae-a1ce-0a05365d2b86"

# R2 bucket na fotky nahraté adminom – `npx wrangler r2 bucket create podhajska-media`
[[r2_buckets]]
binding = "R2"
bucket_name = "podhajska-media"

# SESSION_SECRET a SETUP_TOKEN sú Pages secrets (`npx wrangler pages secret put …`).
# Pre lokálny `wrangler pages dev` (dev:cf) ich daj do `.dev.vars` – viď .dev.vars.example.
# V `[vars]` tu byť nesmú: kolidovali by s rovnomennými secretmi pri deployi.
